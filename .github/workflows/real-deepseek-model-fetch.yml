name: Real DeepSeek Model Fetch

on:
  workflow_dispatch:
  push:
    branches:
      - fix/0.1.24-object-scope-ui
    paths:
      - .github/workflows/real-deepseek-model-fetch.yml
      - tests/e2e/provider_card_matrix/deepseek_real_model_fetch.py
      - tests/e2e/provider_card_matrix/deepseek_real_foreign_matrix_0_1_24.py
      - tests/e2e/provider_card_matrix/browser_matrix.py

permissions:
  contents: read

concurrency:
  group: real-deepseek-model-fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEKAPI: ${{ secrets.DEEPSEEKAPI }}
      ASTRBOT_E2E_URL: http://127.0.0.1:6185
      ASTRBOT_E2E_USERNAME: e2e-admin
      ASTRBOT_E2E_PASSWORD: E2e-password-123
      ASTRBOT_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate DeepSeek secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPSEEKAPI"
          echo "DeepSeek credential is available; value will not be printed or uploaded."

      - name: Clone exact AstrBot 4.27.3 host
        run: git clone --depth 1 --branch v4.27.3 https://github.com/AstrBotDevs/AstrBot.git AstrBot

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot

      - name: Setup pnpm exactly as AstrBot Dashboard CI
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: AstrBot/dashboard/pnpm-lock.yaml

      - name: Build exact AstrBot 4.27.3 Dashboard
        working-directory: AstrBot/dashboard
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install built Dashboard into AstrBot package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AstrBot/astrbot/dashboard/dist
          rsync -a --delete AstrBot/dashboard/dist/ AstrBot/astrbot/dashboard/dist/
          mkdir -p AstrBot/astrbot/dashboard/dist/assets
          printf '4.27.3' > AstrBot/astrbot/dashboard/dist/assets/version

      - name: Initialize AstrBot and install exact plugin checkout
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' | uv run --directory AstrBot astrbot init
          target='AstrBot/data/plugins/astrbot_plugin_volcengine_provider'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AstrBot' \
            ./ "$target"/
          uv run --directory AstrBot astrbot conf set dashboard.username "$ASTRBOT_E2E_USERNAME"
          uv run --directory AstrBot astrbot conf set dashboard.password "$ASTRBOT_E2E_PASSWORD"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start AstrBot
        shell: bash
        run: |
          set -euo pipefail
          nohup setsid uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-deepseek-model-fetch.log 2>&1 &
          echo $! >/tmp/astrbot-deepseek-model-fetch.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "$ASTRBOT_E2E_URL/" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/astrbot-deepseek-model-fetch.pid)" 2>/dev/null; then
              cat /tmp/astrbot-deepseek-model-fetch.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" = '1'
          grep -q 'Volcengine providers registered' /tmp/astrbot-deepseek-model-fetch.log

      - name: Compare direct DeepSeek models with AstrBot Dashboard fetch
        run: python tests/e2e/provider_card_matrix/deepseek_real_model_fetch.py

      - name: Capture redacted startup diagnostics only
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/astrbot-deepseek-model-fetch.log')
          target = Path('e2e-artifacts/deepseek-real-model-fetch/startup.redacted.log')
          target.parent.mkdir(parents=True, exist_ok=True)
          text = source.read_text('utf-8', errors='replace') if source.exists() else ''
          text = re.sub(r'(?i)(authorization|api[_ -]?key|bearer)\s*[:=]\s*\S+', r'\1=<redacted>', text)
          target.write_text(text[-50000:], encoding='utf-8')
          PY

      - name: Stop AstrBot
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s /tmp/astrbot-deepseek-model-fetch.pid ]; then
            pid=$(cat /tmp/astrbot-deepseek-model-fetch.pid)
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          fi
          pkill -f 'astrbot run --port 6185' 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-deepseek-model-fetch
          path: e2e-artifacts/deepseek-real-model-fetch
          if-no-files-found: error
          retention-days: 7
