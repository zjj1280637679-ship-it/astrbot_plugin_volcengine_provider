name: Patch browser matrix first-run harness

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-browser-matrix-first-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
          fetch-depth: 0
      - name: Patch delayed first-run dialog handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/provider_card_matrix/browser_matrix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    await expect(add_button).to_be_visible(timeout=10_000)\n    await add_button.click()\n    menu_item = page.locator(\n        ".v-overlay:visible .v-list-item", has_text=case.menu_label\n    ).first\n'''
          new = '''    await expect(add_button).to_be_visible(timeout=10_000)\n    await add_button.click()\n\n    # On a fresh AstrBot profile the first-run notice may mount *after* the\n    # Source menu opens. Give that native dialog a bounded chance to appear;\n    # if it does, dismiss it and reopen the Source menu. This keeps a host\n    # onboarding overlay from being misclassified as a provider-card failure.\n    await page.wait_for_timeout(1_200)\n    if await dismiss_first_run_dialog(page):\n        await add_button.click()\n\n    menu_item = page.locator(\n        ".v-overlay:visible .v-list-item", has_text=case.menu_label\n    ).first\n'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected add_source snippet count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit harness fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/provider_card_matrix/browser_matrix.py
          git commit -m "test: handle delayed AstrBot first-run dialog in UI matrix"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
