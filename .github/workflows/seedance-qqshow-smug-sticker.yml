name: Seedance QQ Show Smug Sticker

on:
  push:
    paths:
      - '.github/seedance-qqshow-smug-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARK_API_KEY: ${{ secrets.HUOSHANYINQINGAPI }}
      MODEL_ID: doubao-seedance-1-5-pro-251215
      IMAGE_URL: https://raw.githubusercontent.com/zjj1280637679-ship-it/astrbot_plugin_volcengine_provider/main/assets/seedance_tests/qqshow_smug_frame_20260812.jpg
    steps:
      - name: Validate prerequisites
        shell: bash
        run: |
          test -n "$ARK_API_KEY" || { echo 'HUOSHANYINQINGAPI unavailable'; exit 2; }
          mkdir -p output
          python3 - <<'PY'
          import os, urllib.request
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'github-actions'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read(); ct=r.headers.get('Content-Type','')
          print('reference content-type:',ct)
          print('reference bytes:',len(data))
          if len(data)<1024 or not ct.startswith('image/'):
              raise SystemExit('reference image prerequisite failed')
          open('output/reference.jpg','wb').write(data)
          PY

      - name: Create and poll Seedance task
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          prompt=(
              'Preserve the exact same chibi character design, face, black medium-length hair, golden eyes, red-and-black demon horns, small goatee, red traditional robe with gold embroidery, black shoes, white socks, orange-red fox tail, and full-body composition from the reference image. '
              'Create a cute looping chat-sticker motion with a fixed camera and plain light background. The character keeps the arms crossed. '
              'Action: start almost still; gently tilt the head a little, raise one eyebrow with a smug confident expression, let the corner of the mouth curl into a subtle mischievous smirk, hold the smug look briefly, then smoothly return very close to the starting pose by the end. '
              'Only tiny natural secondary motion in hair, robe hem and tail. No walking, no large body movement, no camera movement, no zoom, no new objects, no text, no costume changes, no extra limbs, no morphing, no scene change. '
              '--ratio 9:16 --dur 5'
          )
          payload={
              'model':os.environ['MODEL_ID'],
              'content':[
                  {'type':'text','text':prompt},
                  {'type':'image_url','image_url':{'url':os.environ['IMAGE_URL']}}
              ],
              'generate_audio':False
          }
          base='https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks'
          headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['ARK_API_KEY']}
          record={'model':os.environ['MODEL_ID'],'prompt':prompt,'image_url':os.environ['IMAGE_URL'],'payload':payload,'start_unix':time.time()}
          req=urllib.request.Request(base,data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers=headers,method='POST')
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  created=json.loads(r.read().decode('utf-8')); record['create_http_status']=r.status
          except urllib.error.HTTPError as e:
              record['create_http_status']=e.code; record['create_error_body']=e.read().decode('utf-8','replace'); record['final_state']='create_failed'
              json.dump(record,open('output/task.json','w'),ensure_ascii=False,indent=2); print(json.dumps(record,ensure_ascii=False,indent=2)); raise SystemExit(1)
          task_id=created.get('id'); record['create_response']=created; record['task_id']=task_id
          if not task_id: raise SystemExit('No task id returned')
          status_url=base+'/'+task_id; poll_headers={'Authorization':'Bearer '+os.environ['ARK_API_KEY']}
          for attempt in range(90):
              with urllib.request.urlopen(urllib.request.Request(status_url,headers=poll_headers,method='GET'),timeout=60) as r:
                  data=json.loads(r.read().decode('utf-8'))
              status=data.get('status',''); print('poll',attempt+1,status); record['poll_count']=attempt+1; record['last_status']=status
              if status=='succeeded':
                  record['final_state']='succeeded'; record['final_response']=data
                  video_url=((data.get('content') or {}).get('video_url'))
                  if not video_url: raise SystemExit('Succeeded but no video_url')
                  req2=urllib.request.Request(video_url,headers={'User-Agent':'github-actions'})
                  with urllib.request.urlopen(req2,timeout=180) as r, open('output/qqshow_smug_5s.mp4','wb') as out:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          out.write(chunk)
                  record['downloaded_video_bytes']=os.path.getsize('output/qqshow_smug_5s.mp4')
                  break
              if status in ('failed','cancelled'):
                  record['final_state']=status; record['final_response']=data; break
              time.sleep(10)
          else:
              record['final_state']='timeout'
          record['end_unix']=time.time(); record['wall_seconds']=record['end_unix']-record['start_unix']
          with open('output/task.json','w',encoding='utf-8') as f: json.dump(record,f,ensure_ascii=False,indent=2)
          print(json.dumps(record,ensure_ascii=False,indent=2))
          if record.get('final_state')!='succeeded': raise SystemExit('generation did not succeed')
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: seedance-qqshow-smug-sticker
          path: output/
          if-no-files-found: error
          retention-days: 1
