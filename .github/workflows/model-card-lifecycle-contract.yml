name: Current Model-card Lifecycle Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  restart-replace-uninstall:
    name: AstrBot ${{ matrix.astrbot-version }} real lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ['4.27.3', '4.27.4', '4.28.0-beta.1']
    env:
      ASTRBOT_E2E_URL: http://127.0.0.1:6185
      ASTRBOT_E2E_USERNAME: e2e-admin
      ASTRBOT_E2E_PASSWORD: E2e-password-123
      ASTRBOT_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
      ASTRBOT_E2E_CONFIG_PATH: ${{ github.workspace }}/AstrBot/data/cmd_config.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Clone exact AstrBot host
        run: >-
          git clone --depth 1 --branch v${{ matrix.astrbot-version }}
          https://github.com/AstrBotDevs/AstrBot.git AstrBot

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: AstrBot/dashboard/pnpm-lock.yaml

      - name: Build exact AstrBot Dashboard
        working-directory: AstrBot/dashboard
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install built Dashboard into AstrBot package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AstrBot/astrbot/dashboard/dist
          rsync -a --delete AstrBot/dashboard/dist/ AstrBot/astrbot/dashboard/dist/
          mkdir -p AstrBot/astrbot/dashboard/dist/assets
          printf '${{ matrix.astrbot-version }}' > AstrBot/astrbot/dashboard/dist/assets/version

      - name: Initialize persistent AstrBot state and install exact candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' | uv run --directory AstrBot astrbot init
          target='AstrBot/data/plugins/astrbot_plugin_volcengine_provider'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AstrBot' \
            ./ "$target"/
          uv run --directory AstrBot astrbot conf set dashboard.username "$ASTRBOT_E2E_USERNAME"
          uv run --directory AstrBot astrbot conf set dashboard.password "$ASTRBOT_E2E_PASSWORD"
          mkdir -p e2e-artifacts

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start AstrBot for setup
        shell: bash
        run: |
          set -euo pipefail
          nohup setsid uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-current-lifecycle.log 2>&1 &
          echo $! >/tmp/astrbot-current-lifecycle.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "$ASTRBOT_E2E_URL/" >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/astrbot-current-lifecycle.pid)" 2>/dev/null; then cat /tmp/astrbot-current-lifecycle.log; exit 1; fi
            sleep 1
          done
          test "$ready" = '1'
          grep -q 'Volcengine providers registered' /tmp/astrbot-current-lifecycle.log

      - name: Create cards, click Video, save and prove Dashboard refresh
        run: python tests/e2e/provider_card_matrix/current_lifecycle_contract.py --stage setup

      - name: Stop AstrBot before process restart
        shell: bash
        run: |
          set -euo pipefail
          pid=$(cat /tmp/astrbot-current-lifecycle.pid)
          kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          for i in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$pid" 2>/dev/null; then kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true; fi

      - name: Restart same AstrBot state
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/astrbot-current-lifecycle.log
          nohup setsid uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-current-lifecycle.log 2>&1 &
          echo $! >/tmp/astrbot-current-lifecycle.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "$ASTRBOT_E2E_URL/" >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/astrbot-current-lifecycle.pid)" 2>/dev/null; then cat /tmp/astrbot-current-lifecycle.log; exit 1; fi
            sleep 1
          done
          test "$ready" = '1'
          grep -q 'Volcengine providers registered' /tmp/astrbot-current-lifecycle.log

      - name: Prove checked Video and request rows after real process restart
        run: python tests/e2e/provider_card_matrix/current_lifecycle_contract.py --stage after-restart

      - name: Stop AstrBot before same-version replacement
        shell: bash
        run: |
          set -euo pipefail
          pid=$(cat /tmp/astrbot-current-lifecycle.pid)
          kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          for i in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$pid" 2>/dev/null; then kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true; fi

      - name: Replace plugin directory with exact same candidate
        shell: bash
        run: |
          set -euo pipefail
          target='AstrBot/data/plugins/astrbot_plugin_volcengine_provider'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AstrBot' \
            ./ "$target"/
          test -f "$target/main.py"
          test -f "$target/metadata.yaml"

      - name: Restart after same-version replacement
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/astrbot-current-lifecycle.log
          nohup setsid uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-current-lifecycle.log 2>&1 &
          echo $! >/tmp/astrbot-current-lifecycle.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "$ASTRBOT_E2E_URL/" >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/astrbot-current-lifecycle.pid)" 2>/dev/null; then cat /tmp/astrbot-current-lifecycle.log; exit 1; fi
            sleep 1
          done
          test "$ready" = '1'
          grep -q 'Volcengine providers registered' /tmp/astrbot-current-lifecycle.log

      - name: Prove model-card state after same-version replacement
        run: python tests/e2e/provider_card_matrix/current_lifecycle_contract.py --stage after-same-version-update

      - name: Stop AstrBot and uninstall candidate
        shell: bash
        run: |
          set -euo pipefail
          pid=$(cat /tmp/astrbot-current-lifecycle.pid)
          kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          for i in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$pid" 2>/dev/null; then kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true; fi
          rm -rf AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          test ! -e AstrBot/data/plugins/astrbot_plugin_volcengine_provider

      - name: Restart AstrBot without plugin
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/astrbot-current-lifecycle.log
          nohup setsid uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-current-lifecycle.log 2>&1 &
          echo $! >/tmp/astrbot-current-lifecycle.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS "$ASTRBOT_E2E_URL/" >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/astrbot-current-lifecycle.pid)" 2>/dev/null; then cat /tmp/astrbot-current-lifecycle.log; exit 1; fi
            sleep 1
          done
          test "$ready" = '1'
          if grep -q 'Volcengine providers registered' /tmp/astrbot-current-lifecycle.log; then
            echo 'plugin unexpectedly loaded after uninstall'
            cat /tmp/astrbot-current-lifecycle.log
            exit 1
          fi

      - name: Prove no plugin-owned public UI remains after uninstall
        run: python tests/e2e/provider_card_matrix/current_lifecycle_contract.py --stage uninstalled

      - name: Capture lifecycle log
        if: always()
        run: cp /tmp/astrbot-current-lifecycle.log e2e-artifacts/final-startup.log 2>/dev/null || true

      - name: Final process cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s /tmp/astrbot-current-lifecycle.pid ]; then
            pid=$(cat /tmp/astrbot-current-lifecycle.pid)
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
          fi
          pkill -f 'astrbot run --port 6185' 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-lifecycle-${{ matrix.astrbot-version }}
          path: e2e-artifacts/current-lifecycle
          if-no-files-found: error
          retention-days: 14
