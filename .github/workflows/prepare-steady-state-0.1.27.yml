name: Prepare stable 0.1.27 README

on:
  push:
    branches:
      - chore/steady-state-0.1.27

permissions:
  contents: write

concurrency:
  group: prepare-steady-state-0.1.27
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/steady-state-0.1.27
          fetch-depth: 0
      - name: Apply exact stable-state README projection
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/PROJECT_STATE.json >/dev/null
          grep -F 'version-0.1.27_stable' README.md
          grep -F '| 你可以安装的稳定版 | **0.1.27**' README.md
          grep -F '| 活跃发布候选 | **无**' README.md
          grep -F '当前可安装稳定 `runtime` 为 0.1.27' README.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: project stable 0.1.27 state'
          git push origin HEAD:chore/steady-state-0.1.27
