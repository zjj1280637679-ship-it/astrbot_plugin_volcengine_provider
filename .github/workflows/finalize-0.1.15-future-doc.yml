name: Finalize 0.1.15 future feedback docs

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/finalize-0.1.15-future-doc.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
      - name: Add future-token note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text('utf-8')
          anchor = '## 0.1.15\n\n'
          bullet = '- `/models` 模态反馈不再过滤到当前插件认识的 `text/image/audio/video` 枚举：上游未来新增的非空模态 token 会作为本轮信息原样保留，由当前 AstrBot 自然忽略或由未来宿主解释；今天的适配器不替未来删除信息。\n'
          assert anchor in text
          p.write_text(text.replace(anchor, anchor + bullet, 1), 'utf-8')
          PY
          rm .github/workflows/finalize-0.1.15-future-doc.yml
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/finalize-0.1.15-future-doc.yml
          git diff --cached --check
          git commit -m "docs: record future-safe modality feedback"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
