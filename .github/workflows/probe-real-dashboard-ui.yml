name: Probe real AstrBot Dashboard UI

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/probe-real-dashboard-ui.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch v4.27.2 https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory AstrBot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build AstrBot Dashboard
        run: |
          corepack enable
          cd AstrBot/dashboard
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../astrbot/dashboard/dist
          rsync -a --delete dist/ ../astrbot/dashboard/dist/
          mkdir -p ../astrbot/dashboard/dist/assets
          printf '4.27.2' > ../astrbot/dashboard/dist/assets/version
      - name: Initialize AstrBot and install plugin
        run: |
          uv run --directory AstrBot astrbot init
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
          uv run --directory AstrBot astrbot conf set dashboard.username e2e-admin
          uv run --directory AstrBot astrbot conf set dashboard.password e2e-password
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start AstrBot
        run: |
          nohup uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-e2e.log 2>&1 &
          echo $! >/tmp/astrbot-e2e.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6185/ >/dev/null 2>&1; then
              echo 'AstrBot Dashboard is up'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astrbot-e2e.log
          exit 1
      - name: Run real Dashboard browser probe
        env:
          ASTRBOT_E2E_URL: http://127.0.0.1:6185
          ASTRBOT_E2E_USERNAME: e2e-admin
          ASTRBOT_E2E_PASSWORD: e2e-password
          ASTRBOT_E2E_ARTIFACT_DIR: e2e-artifacts
        run: python tests/e2e/provider_card_matrix/browser_probe.py
      - name: Show AstrBot log on failure
        if: failure()
        run: cat /tmp/astrbot-e2e.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dashboard-ui-probe
          path: e2e-artifacts
          if-no-files-found: ignore
