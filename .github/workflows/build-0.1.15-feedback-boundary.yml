        uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: 30e20318cbaaa2e1ba57f3e0eee265d9ee98115c
          path: AstrBot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install frozen AstrBot dependencies
        working-directory: AstrBot
        run: uv sync --no-dev --exclude-newer 2026-08-10T13:00:00Z

      - name: Install plugin into AstrBot
        run: |
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude='.git' --exclude='.github' --exclude='AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/

      - name: Run semantic regression
        run: AstrBot/.venv/bin/python tests/test_0_1_15_feedback_boundary.py

      - name: Verify audio/video adapter separation survived
        shell: bash
        run: |
          AstrBot/.venv/bin/python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('AstrBot/data/plugins')))
          from astrbot_plugin_volcengine_provider.adapters.audio import build_ark_input_audio
          from astrbot_plugin_volcengine_provider.adapters.video import inject_current_request_videos
          from astrbot_plugin_volcengine_provider.providers import ProviderVolcengineArk
          assert callable(build_ark_input_audio)
          assert callable(inject_current_request_videos)
          assert ProviderVolcengineArk.__module__.endswith('.providers')
          print('MEDIA_ADAPTER_BOUNDARY=OK')
          PY

      - name: Real ordinary Ark E2E
        if: env.VOLCENGINE_API_KEY != ''
        shell: bash
        run: |
          AstrBot/.venv/bin/python - <<'PY'
          import asyncio
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('AstrBot/data/plugins')))
          from astrbot_plugin_volcengine_provider.providers import ProviderVolcengineArk

          model = 'doubao-seed-2-0-pro-260215'
          provider = ProviderVolcengineArk({
              'id': 'rc15-live',
              'provider': 'volcengine',
              'type': 'volcengine_ark_chat_completion',
              'provider_type': 'chat_completion',
              'enable': True,
              'key': [os.environ['VOLCENGINE_API_KEY']],
              'api_base': 'https://ark.cn-beijing.volces.com/api/v3',
              'model': model,
              'timeout': 60,
              'modalities': ['text'],
          }, {'request_max_retries': 1})

          async def main():
              models = await provider.get_models()
              assert model in models
              response = await provider.text_chat(
                  prompt='Reply with exactly RC15_OK.',
                  contexts=[],
                  system_prompt='',
                  model=model,
                  request_max_retries=1,
                  max_tokens=16,
              )
              text = (response.completion_text or '').strip()
              print('RC15_MODEL_COUNT=', len(models))
              print('RC15_RESPONSE=', text)
              assert 'RC15_OK' in text

          asyncio.run(main())
          print('REAL_ARK_0_1_15=OK')
          PY

