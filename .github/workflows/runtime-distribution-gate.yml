name: Runtime Distribution Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  artifact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reject stale HOT documentation authority
        run: python tools/release/check_knowledge_state.py
      - name: Build allow-list runtime artifact
        run: python tools/release/build_runtime_package.py
      - name: Prove default-branch export equals runtime artifact
        run: python tools/release/check_default_archive_equivalence.py
      - name: Audit package inventory and hard size ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/runtime-manifest.json').read_text('utf-8'))
          forbidden = ('.github/', 'tests/', 'docs/', 'evidence/', 'governance/', 'strategy/', 'model_cards/', 'assets/', 'tools/')
          paths = [item['path'] for item in manifest['files']]
          bad = [p for p in paths if p.startswith(forbidden)]
          if bad:
              raise SystemExit(f'forbidden runtime paths: {bad}')
          if manifest['zip_bytes'] >= 16 * 1024 * 1024:
              raise SystemExit('AstrBot market ZIP hard limit exceeded')
          print(json.dumps({
              'version': manifest['version'],
              'file_count': manifest['file_count'],
              'uncompressed_bytes': manifest['uncompressed_bytes'],
              'zip_bytes': manifest['zip_bytes'],
          }, indent=2))
          PY
          unzip -l dist/astrbot_plugin_volcengine_provider-runtime.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/astrbot_plugin_volcengine_provider-runtime.zip
            dist/runtime-manifest.json
          if-no-files-found: error
          retention-days: 7

  astrbot-runtime-load:
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.26.1, v4.27.2]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build minimal runtime package
        run: python tools/release/build_runtime_package.py
      - name: Clone tested AstrBot
        run: git clone --depth 1 --branch '${{ matrix.astrbot_ref }}' https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot
      - name: Validate package metadata with the host API available in this AstrBot version
        shell: bash
        run: |
          uv run --directory AstrBot python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          root = Path.cwd().parent / 'dist' / 'runtime' / 'astrbot_plugin_volcengine_provider'
          manifest = json.loads(
              (Path.cwd().parent / 'dist' / 'runtime-manifest.json').read_text('utf-8')
          )
          metadata = yaml.safe_load((root / 'metadata.yaml').read_text('utf-8'))
          assert metadata['name'] == 'astrbot_plugin_volcengine_provider'
          assert metadata['version'] == manifest['version']
          assert str(metadata['repo']).endswith('/tree/runtime')

          try:
              from astrbot.core.star.updater import _PluginUpdater
          except ModuleNotFoundError:
              print('ASTRBOT_PACKAGE_INSPECTOR=UNAVAILABLE_ON_THIS_HOST')
          else:
              inspected = _PluginUpdater.inspect_plugin_directory(root)['metadata']
              assert inspected['name'] == metadata['name']
              assert inspected['version'] == metadata['version']
              print('ASTRBOT_PACKAGE_INSPECTOR=OK')
          print('RUNTIME_METADATA_CONTRACT=OK')
          PY
      - name: Compile only files that users receive
        shell: bash
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/runtime-pycache" \
            python -m compileall -q \
            dist/runtime/astrbot_plugin_volcengine_provider
      - name: Install only runtime package into a clean AstrBot data directory
        shell: bash
        run: |
          touch AstrBot/.astrbot
          printf '\n' | uv run --directory AstrBot astrbot init
          target='AstrBot/data/plugins/astrbot_plugin_volcengine_provider'
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a dist/runtime/astrbot_plugin_volcengine_provider/ "$target"/
          test ! -e "$target/.github"
          test ! -e "$target/tests"
          test ! -e "$target/docs"
      - name: Install ffmpeg for the real compressed-video contract
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'
      - name: Run packaged provider and Dashboard contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_0_1_15_feedback_boundary.py \
            tests/test_0_1_19_model_fields.py \
            tests/test_0_1_19_model_fields_ui.py \
            tests/test_0_1_19_provider_overrides.py \
            tests/test_dashboard_bridge_compat.py \
            tests/test_dashboard_save_boundary.py \
            tests/test_live_feedback_presence.py \
            tests/test_model_card_ui_scope.py \
            tests/test_video_transport_guards.py \
            tests/e2e/provider_card_matrix/service_matrix.py
          do
            uv run --directory AstrBot python "../${test_file}"
          done
      - name: Start AstrBot and prove packaged plugin loads
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run --directory AstrBot astrbot run --port 6185 >runtime-load.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 75); do
            if grep -q 'Volcengine providers registered' runtime-load.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat runtime-load.log
              exit 1
            fi
            sleep 1
          done
          cat runtime-load.log
          test "$ready" = '1'
          kill "$pid" 2>/dev/null || true
