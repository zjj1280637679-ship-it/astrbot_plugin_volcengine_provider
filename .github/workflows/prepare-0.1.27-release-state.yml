name: Prepare 0.1.27 release-state patch

on:
  push:
    branches:
      - chore/0.1.27-release-state

permissions:
  contents: write

concurrency:
  group: prepare-0.1.27-release-state
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/0.1.27-release-state
          fetch-depth: 0
      - name: Apply exact release-state corrections
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
      - name: Verify and commit the prepared branch
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/PROJECT_STATE.json >/dev/null
          grep -F 'version: "0.1.27"' metadata.yaml
          grep -F 'version-0.1.27_candidate' README.md
          grep -F '| 你可以安装的稳定版 | **0.1.26**' README.md
          grep -F '| 活跃发布候选 | **0.1.27**' README.md
          grep -F '## 0.1.26（已发布到 runtime）' CHANGELOG.md
          test "$(grep -Fxc '## 0.1.27' CHANGELOG.md)" -eq 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m '0.1.27: normalize published release state'
          git push origin HEAD:chore/0.1.27-release-state
