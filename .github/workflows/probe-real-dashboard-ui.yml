name: Real AstrBot Dashboard Reachability Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-evidence-${{ github.repository }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git clone --depth 1 --branch v4.27.2 https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --directory AstrBot
      - name: Setup pnpm exactly as AstrBot v4.27.2 Dashboard CI
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: AstrBot/dashboard/pnpm-lock.yaml
      - name: Build AstrBot Dashboard
        working-directory: AstrBot/dashboard
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Install built Dashboard into AstrBot package
        run: |
          mkdir -p AstrBot/astrbot/dashboard/dist
          rsync -a --delete AstrBot/dashboard/dist/ AstrBot/astrbot/dashboard/dist/
          mkdir -p AstrBot/astrbot/dashboard/dist/assets
          printf '4.27.2' > AstrBot/astrbot/dashboard/dist/assets/version
      - name: Initialize AstrBot and install plugin
        run: |
          uv run --directory AstrBot astrbot init -y
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
          uv run --directory AstrBot astrbot conf set dashboard.username e2e-admin
          uv run --directory AstrBot astrbot conf set dashboard.password E2e-password-123
      - name: Capture secret-free pre-run evidence
        run: |
          mkdir -p e2e-artifacts
          find AstrBot/data/plugins/astrbot_plugin_volcengine_provider -maxdepth 3 -type f -printf '%P\n' | sort > e2e-artifacts/plugin-tree.txt
          test -f AstrBot/data/plugins/astrbot_plugin_volcengine_provider/main.py
          test -f AstrBot/data/plugins/astrbot_plugin_volcengine_provider/metadata.yaml
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('AstrBot/data/cmd_config.json')
          target = Path('e2e-artifacts/config-before-run.redacted.json')
          data = json.loads(source.read_text(encoding='utf-8-sig'))

          def redact(value, key=''):
              lowered = key.lower()
              if any(word in lowered for word in ('password', 'secret', 'token', 'api_key', 'apikey', 'key')):
                  return '<redacted>'
              if isinstance(value, dict):
                  return {k: redact(v, str(k)) for k, v in value.items()}
              if isinstance(value, list):
                  return [redact(item, key) for item in value]
              return value

          target.write_text(json.dumps(redact(data), ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start AstrBot and verify plugin runtime
        run: |
          nohup uv run --directory AstrBot astrbot run --port 6185 >/tmp/astrbot-e2e.log 2>&1 &
          echo $! >/tmp/astrbot-e2e.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6185/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          cp /tmp/astrbot-e2e.log e2e-artifacts/startup.log || true
          if [ "$ready" != "1" ]; then
            cat /tmp/astrbot-e2e.log
            exit 1
          fi
          grep -E 'Loading plugin astrbot_plugin_volcengine_provider|Plugin astrbot_plugin_volcengine_provider|Volcengine providers registered' /tmp/astrbot-e2e.log > e2e-artifacts/plugin-runtime.log
          grep -q 'Volcengine providers registered' /tmp/astrbot-e2e.log
      - name: Collect real Dashboard presentation evidence
        env:
          ASTRBOT_E2E_URL: http://127.0.0.1:6185
          ASTRBOT_E2E_USERNAME: e2e-admin
          ASTRBOT_E2E_PASSWORD: E2e-password-123
          ASTRBOT_E2E_ARTIFACT_DIR: e2e-artifacts
        run: python tests/e2e/provider_card_matrix/browser_probe.py
      - name: Capture final AstrBot log
        if: always()
        run: cp /tmp/astrbot-e2e.log e2e-artifacts/startup.log || true
      - name: Show AstrBot log on hard failure
        if: failure()
        run: cat /tmp/astrbot-e2e.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-dashboard-ui-evidence
          path: e2e-artifacts
          if-no-files-found: error
