name: Verify 0.1.15 UI key bijection

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/verify-0.1.15-ui-bijection.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.26.1, v4.27.2]
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch "${{ matrix.astrbot_ref }}" https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory AstrBot
      - run: |
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
      - run: uv run --directory AstrBot python -m py_compile data/plugins/astrbot_plugin_volcengine_provider/registry.py
      - run: uv run --directory AstrBot python ../tests/test_model_card_ui_scope.py
      - run: uv run --directory AstrBot python ../tests/test_dashboard_save_boundary.py
      - run: uv run --directory AstrBot python ../tests/test_dashboard_bridge_compat.py
