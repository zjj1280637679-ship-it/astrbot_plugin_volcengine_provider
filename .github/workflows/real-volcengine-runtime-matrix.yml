name: Real Volcengine Protocol Attribution

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: Confirm that this run may call the paid Volcengine API
        required: true
        type: boolean
        default: false

concurrency:
  group: paid-volcengine-api-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-evidence:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_paid_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: paid-volcengine
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate secret presence
        shell: bash
        env:
          ARK_API_KEY: ${{ secrets.HUOSHANYINQINGAPI }}
        run: |
          if [ -z "$ARK_API_KEY" ]; then
            echo "HUOSHANYINQINGAPI ordinary Ark key is unavailable; downstream protocol evidence cannot be collected."
            exit 2
          fi
          echo "Ordinary Ark secret is available; value will not be printed."
      - run: git clone --depth 1 --branch v4.27.2 https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install AstrBot runtime exactly from v4.27.2
        run: uv sync --directory AstrBot
      - name: Compile downstream attribution probe
        run: python -m py_compile tests/e2e/real_volcengine_runtime_matrix.py
      - name: Execute raw-vs-plugin downstream attribution
        shell: bash
        env:
          ARK_API_KEY: ${{ secrets.HUOSHANYINQINGAPI }}
          AGENT_PLAN_API_KEY: ${{ secrets.VOLCENGINE_AGENT_PLAN_API_KEY }}
        run: |
          mkdir -p "$E2E_ARTIFACT_DIR"
          uv run --directory AstrBot python "$GITHUB_WORKSPACE/tests/e2e/real_volcengine_runtime_matrix.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-volcengine-protocol-attribution
          path: e2e-artifacts
          if-no-files-found: error
          retention-days: 7
