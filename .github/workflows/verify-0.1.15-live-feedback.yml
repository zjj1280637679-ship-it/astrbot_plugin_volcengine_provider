name: Verify 0.1.15 live feedback semantics

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/verify-0.1.15-live-feedback.yml

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref:
          - v4.26.1
          - v4.27.2

    steps:
      - name: Checkout plugin branch
        uses: actions/checkout@v4

      - name: Checkout AstrBot ${{ matrix.astrbot_ref }}
        run: |
          git clone --depth 1 --branch "${{ matrix.astrbot_ref }}" \
            https://github.com/AstrBotDevs/AstrBot.git AstrBot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install AstrBot dependencies
        run: uv sync --directory AstrBot

      - name: Install plugin into AstrBot
        run: |
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AstrBot' \
            ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/

      - name: Compile changed modules
        run: |
          uv run --directory AstrBot python -m py_compile \
            data/plugins/astrbot_plugin_volcengine_provider/adapters/errors.py \
            data/plugins/astrbot_plugin_volcengine_provider/adapters/audio.py \
            data/plugins/astrbot_plugin_volcengine_provider/adapters/video.py \
            data/plugins/astrbot_plugin_volcengine_provider/capabilities/source_hints.py \
            data/plugins/astrbot_plugin_volcengine_provider/providers.py \
            data/plugins/astrbot_plugin_volcengine_provider/registry.py

      - name: Validate machine-readable semantics
        run: python -m json.tool capabilities/SEMANTICS.json >/dev/null

      - name: Run feedback-boundary regression
        run: uv run --directory AstrBot python ../tests/test_0_1_15_feedback_boundary.py

      - name: Run Dashboard compatibility regression
        run: uv run --directory AstrBot python ../tests/test_dashboard_bridge_compat.py

      - name: Verify Provider registration
        run: |
          uv run --directory AstrBot python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('data/plugins').resolve()))
          import astrbot_plugin_volcengine_provider.main  # noqa: F401
          from astrbot.core.provider.register import provider_cls_map

          assert 'volcengine_ark_chat_completion' in provider_cls_map
          assert 'volcengine_agent_plan_chat_completion' in provider_cls_map
          print('PROVIDER_REGISTRATION=OK')
          PY
