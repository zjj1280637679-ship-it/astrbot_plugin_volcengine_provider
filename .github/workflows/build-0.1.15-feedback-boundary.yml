name: Build 0.1.15 feedback boundary

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/build-0.1.15-feedback-boundary.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VOLCENGINE_API_KEY: ${{ secrets.HUOSHANYINQINGAPI }}
    steps:
      - name: Checkout clean 0.1.15 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
          fetch-depth: 0

      - name: Apply 0.1.15 feedback-boundary integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Per-model-card adapter setting + sparse Source feedback.
          # ------------------------------------------------------------------
          Path('capabilities').mkdir(exist_ok=True)
          Path('capabilities/model_scope.py').write_text(dedent(r'''
          """Per-model-card Volcengine adapter settings and legacy migration.

          This module never infers model capabilities. The video flag is only a
          request-transport setting. AstrBot native capability feedback such as
          ``modalities`` remains host-owned and is never rewritten here.
          """

          from __future__ import annotations

          from collections.abc import Mapping
          from typing import Any

          ARK_PROVIDER_TYPE = "volcengine_ark_chat_completion"
          AGENT_PLAN_PROVIDER_TYPE = "volcengine_agent_plan_chat_completion"
          OWNED_SOURCE_TYPES = frozenset({ARK_PROVIDER_TYPE, AGENT_PLAN_PROVIDER_TYPE})

          VIDEO_INPUT_ENABLED_KEY = "volcengine_video_input_enabled"
          LEGACY_MODEL_VIDEO_INPUT_KEY = "volcengine_model_video_input"
          LEGACY_SOURCE_VIDEO_KEYS = {
              ARK_PROVIDER_TYPE: "volcengine_ark_video_input",
              AGENT_PLAN_PROVIDER_TYPE: "volcengine_agent_plan_video_input",
          }


          def source_scope_id(provider_config: Mapping[str, Any]) -> str:
              return str(
                  provider_config.get("provider_source_id")
                  or provider_config.get("id")
                  or ""
              ).strip()


          def video_input_enabled(provider_config: Mapping[str, Any]) -> bool:
              """Return the current card's video transport setting.

              Missing is the transport default (disabled), not a negative model
              capability claim. Users can enable the channel per model card;
              upstream accept/reject remains runtime feedback.
              """

              explicit = provider_config.get(VIDEO_INPUT_ENABLED_KEY)
              if isinstance(explicit, bool):
                  return explicit
              legacy = provider_config.get(LEGACY_MODEL_VIDEO_INPUT_KEY)
              if isinstance(legacy, bool):
                  return legacy
              return False


          def source_types(config: Mapping[str, Any]) -> dict[str, str]:
              result: dict[str, str] = {}
              sources = config.get("provider_sources", [])
              if not isinstance(sources, list):
                  return result
              for source in sources:
                  if not isinstance(source, dict):
                      continue
                  source_id = str(source.get("id") or "").strip()
                  if source_id:
                      result[source_id] = str(source.get("type") or "").strip()
              return result


          def owned_source_type_for_card(
              provider_config: Mapping[str, Any],
              provider_sources: list[dict[str, Any]] | object,
          ) -> str:
              source_id = str(provider_config.get("provider_source_id") or "").strip()
              if not source_id or not isinstance(provider_sources, list):
                  return ""
              for source in provider_sources:
                  if not isinstance(source, dict):
                      continue
                  if str(source.get("id") or "").strip() != source_id:
                      continue
                  source_type = str(source.get("type") or "").strip()
                  return source_type if source_type in OWNED_SOURCE_TYPES else ""
              return ""


          def normalize_owned_model_card_for_save(
              provider_config: dict[str, Any],
              provider_sources: list[dict[str, Any]] | object,
              *,
              default_enabled: bool | None = None,
          ) -> dict[str, Any]:
              """Normalize only plugin-owned transport keys on one owned card."""

              if not owned_source_type_for_card(provider_config, provider_sources):
                  return provider_config

              explicit = provider_config.get(VIDEO_INPUT_ENABLED_KEY)
              legacy = provider_config.get(LEGACY_MODEL_VIDEO_INPUT_KEY)
              if not isinstance(explicit, bool):
                  if isinstance(legacy, bool):
                      provider_config[VIDEO_INPUT_ENABLED_KEY] = legacy
                  elif isinstance(default_enabled, bool):
                      provider_config[VIDEO_INPUT_ENABLED_KEY] = default_enabled
              provider_config.pop(LEGACY_MODEL_VIDEO_INPUT_KEY, None)
              return provider_config


          def migrate_legacy_video_settings(config: dict[str, Any]) -> list[str]:
              """Migrate pre-0.1.15 plugin video settings without touching modalities.

              Legacy per-model state beats legacy Source defaults. A ``video``
              entry in AstrBot 4.27 ``modalities`` is read only as a one-time
              migration clue because earlier versions of this plugin stored its
              video transport state there; the host field itself is preserved.
              """

              sources = config.get("provider_sources", [])
              providers = config.get("provider", [])
              if not isinstance(sources, list) or not isinstance(providers, list):
                  return []

              types = source_types(config)
              legacy_defaults: dict[str, bool] = {}
              source_changed = False
              for source in sources:
                  if not isinstance(source, dict):
                      continue
                  source_id = str(source.get("id") or "").strip()
                  legacy_key = LEGACY_SOURCE_VIDEO_KEYS.get(types.get(source_id, ""))
                  if not source_id or not legacy_key:
                      continue
                  value = source.pop(legacy_key, None)
                  if isinstance(value, bool):
                      legacy_defaults[source_id] = value
                      source_changed = True

              changed_ids: list[str] = []
              for provider in providers:
                  if not isinstance(provider, dict):
                      continue
                  source_id = str(provider.get("provider_source_id") or "").strip()
                  if types.get(source_id) not in OWNED_SOURCE_TYPES:
                      continue

                  before = dict(provider)
                  explicit = provider.get(VIDEO_INPUT_ENABLED_KEY)
                  legacy_model = provider.get(LEGACY_MODEL_VIDEO_INPUT_KEY)
                  modalities = provider.get("modalities")

                  if not isinstance(explicit, bool):
                      if isinstance(legacy_model, bool):
                          provider[VIDEO_INPUT_ENABLED_KEY] = legacy_model
                      elif isinstance(modalities, list) and "video" in modalities:
                          # Known historical encoding used by this plugin only.
                          provider[VIDEO_INPUT_ENABLED_KEY] = True
                      elif source_id in legacy_defaults:
                          provider[VIDEO_INPUT_ENABLED_KEY] = legacy_defaults[source_id]

                  provider.pop(LEGACY_MODEL_VIDEO_INPUT_KEY, None)
                  if provider != before:
                      provider_id = str(provider.get("id") or "").strip()
                      if provider_id:
                          changed_ids.append(provider_id)

              if source_changed and not changed_ids:
                  changed_ids.append("")
              return changed_ids
          ''').lstrip(), encoding='utf-8')

          Path('capabilities/source_hints.py').write_text(dedent(r'''
          """Transient Source-scoped sparse feedback for model discovery.

          Missing fields mean unknown, never unsupported. Feedback is scoped by
          ``(source_id, model_id)`` and must never become a process-global model
          capability table or a routing policy.
          """

          from __future__ import annotations

          import copy
          from typing import Any

          _SOURCE_MODEL_HINTS: dict[tuple[str, str], dict[str, Any]] = {}


          def clear_source_model_hints(source_id: str) -> None:
              if not source_id:
                  return
              for key in [key for key in _SOURCE_MODEL_HINTS if key[0] == source_id]:
                  _SOURCE_MODEL_HINTS.pop(key, None)


          def remember_source_model_hint(
              source_id: str,
              model_id: str,
              metadata: dict[str, Any],
          ) -> None:
              if source_id and model_id:
                  _SOURCE_MODEL_HINTS[(source_id, model_id)] = copy.deepcopy(metadata)


          def get_source_model_hints(
              source_id: str,
              model_ids: list[str] | None = None,
          ) -> dict[str, dict[str, Any]]:
              allowed = set(model_ids) if model_ids is not None else None
              result: dict[str, dict[str, Any]] = {}
              for (scope, model_id), metadata in _SOURCE_MODEL_HINTS.items():
                  if scope != source_id:
                      continue
                  if allowed is not None and model_id not in allowed:
                      continue
                  result[model_id] = copy.deepcopy(metadata)
              return result
          ''').lstrip(), encoding='utf-8')

          Path('capabilities/source_migration.py').write_text(dedent(r'''
          """Clean only plugin-owned settings when a model card changes Source."""

          from __future__ import annotations

          from typing import Any

          from .model_scope import (
              LEGACY_MODEL_VIDEO_INPUT_KEY,
              OWNED_SOURCE_TYPES,
              VIDEO_INPUT_ENABLED_KEY,
          )


          def cleanup_owned_settings_on_source_change(
              provider_config: dict[str, Any],
              *,
              old_source_type: str,
              new_source_type: str,
          ) -> bool:
              if (
                  old_source_type not in OWNED_SOURCE_TYPES
                  or new_source_type in OWNED_SOURCE_TYPES
              ):
                  return False
              changed = False
              for key in (VIDEO_INPUT_ENABLED_KEY, LEGACY_MODEL_VIDEO_INPUT_KEY):
                  if key in provider_config:
                      provider_config.pop(key, None)
                      changed = True
              # AstrBot-native feedback (including modalities) is host-owned.
              return changed
          ''').lstrip(), encoding='utf-8')

          Path('capabilities/__init__.py').write_text(dedent(r'''
          """Stable entry point for Volcengine model-card settings and feedback."""

          from .model_scope import (
              AGENT_PLAN_PROVIDER_TYPE,
              ARK_PROVIDER_TYPE,
              LEGACY_MODEL_VIDEO_INPUT_KEY,
              LEGACY_SOURCE_VIDEO_KEYS,
              OWNED_SOURCE_TYPES,
              VIDEO_INPUT_ENABLED_KEY,
              migrate_legacy_video_settings,
              normalize_owned_model_card_for_save,
              owned_source_type_for_card,
              source_scope_id,
              source_types,
              video_input_enabled,
          )
          from .source_hints import (
              clear_source_model_hints,
              get_source_model_hints,
              remember_source_model_hint,
          )
          from .source_migration import cleanup_owned_settings_on_source_change

          __all__ = [
              "AGENT_PLAN_PROVIDER_TYPE",
              "ARK_PROVIDER_TYPE",
              "LEGACY_MODEL_VIDEO_INPUT_KEY",
              "LEGACY_SOURCE_VIDEO_KEYS",
              "OWNED_SOURCE_TYPES",
              "VIDEO_INPUT_ENABLED_KEY",
              "cleanup_owned_settings_on_source_change",
              "clear_source_model_hints",
              "get_source_model_hints",
              "migrate_legacy_video_settings",
              "normalize_owned_model_card_for_save",
              "owned_source_type_for_card",
              "remember_source_model_hint",
              "source_scope_id",
              "source_types",
              "video_input_enabled",
          ]
          ''').lstrip(), encoding='utf-8')

          Path('capabilities/README.md').write_text(dedent(r'''
          # 模型卡设置与能力反馈边界

          这里不保存“模型能做什么”的真值表，只管理：

          - `volcengine_video_input_enabled`：逐模型卡的视频**请求传输开关**；
          - 普通 Ark `/models` 本次明确返回的 Source-scoped 稀疏反馈；
          - 旧插件视频字段的一次性迁移。

          关键语义：

          - 传输开关关闭 = 插件不发送视频；**不等于模型不支持视频**。
          - 反馈字段缺失 = 未反馈；**不等于 False**。
          - AstrBot 自己已有的图片/音频/工具等反馈优先，插件只补缺口。
          - 插件不根据 model ID 推断能力，不选择主模型或 fallback，不建立 CapabilityStore。
          ''').lstrip(), encoding='utf-8')

          # ------------------------------------------------------------------
          # Sparse Ark feedback; Agent Plan names only. No global metadata writer.
          # ------------------------------------------------------------------
          common = Path('metadata/common.py')
          if common.exists():
              common.unlink()

          Path('metadata/ark.py').write_text(dedent(r'''
          """Normalize ordinary Ark `/models` receipts into sparse feedback."""

          from __future__ import annotations

          from typing import Any


          def _dedupe_nonempty(values: object) -> list[str]:
              if not isinstance(values, (list, tuple)):
                  return []
              result: list[str] = []
              seen: set[str] = set()
              for value in values:
                  text = str(value or "").strip()
                  if not text or text in seen:
                      continue
                  seen.add(text)
                  result.append(text)
              return result


          def _as_mapping(value: object) -> dict[str, Any]:
              if isinstance(value, dict):
                  return value
              model_dump = getattr(value, "model_dump", None)
              if callable(model_dump):
                  dumped = model_dump()
                  return dumped if isinstance(dumped, dict) else {}
              return {}


          def _positive_int(value: object) -> int:
              try:
                  parsed = int(value)
              except (TypeError, ValueError):
                  return 0
              return parsed if parsed > 0 else 0


          def _feature_flag(value: object) -> bool | None:
              if isinstance(value, bool):
                  return value
              if isinstance(value, dict):
                  for name in ("supported", "enabled", "available", "function_calling"):
                      if isinstance(value.get(name), bool):
                          return value[name]
              return None


          def _normalized_modalities(values: object) -> list[str]:
              allowed = {"text", "image", "audio", "video"}
              return [value for value in _dedupe_nonempty(values) if value in allowed]


          def normalize_ark_model_metadata(model: object) -> tuple[str, dict[str, Any]]:
              """Return only facts explicitly present in this live receipt."""

              data = _as_mapping(model)
              model_id = str(data.get("id") or getattr(model, "id", "") or "").strip()
              if not model_id:
                  return "", {}

              hint: dict[str, Any] = {"id": model_id}
              modalities = _as_mapping(data.get("modalities"))
              input_mods = _normalized_modalities(modalities.get("input_modalities"))
              output_mods = _normalized_modalities(modalities.get("output_modalities"))
              if input_mods or output_mods:
                  hint["modalities"] = {}
                  if input_mods:
                      hint["modalities"]["input"] = input_mods
                  if output_mods:
                      hint["modalities"]["output"] = output_mods

              limits = _as_mapping(data.get("token_limits"))
              context = _positive_int(limits.get("context_window"))
              output = _positive_int(limits.get("max_output_token_length"))
              if context or output:
                  hint["limit"] = {}
                  if context:
                      hint["limit"]["context"] = context
                  if output:
                      hint["limit"]["output"] = output

              features = _as_mapping(data.get("features"))
              tools = _as_mapping(features.get("tools"))
              tool_call = _feature_flag(tools.get("function_calling"))
              if tool_call is None:
                  tool_call = _feature_flag(features.get("function_calling"))
              if tool_call is not None:
                  hint["tool_call"] = tool_call

              reasoning = _feature_flag(features.get("reasoning"))
              if reasoning is not None:
                  hint["reasoning"] = reasoning

              return model_id, hint
          ''').lstrip(), encoding='utf-8')

          Path('metadata/agent_plan.py').write_text(dedent(r'''
          """Agent Plan model-name discovery only; no model capability priors."""

          AGENT_PLAN_FACTS_VERIFIED_AT = "2026-08-09"
          AGENT_PLAN_FACTS_SOURCE_KIND = "Volcengine live Agent Plan console model list"

          KNOWN_AGENT_PLAN_MODELS = (
              "doubao-seed-2.1-turbo",
              "doubao-seed-evolving",
              "doubao-seed-2.0-lite",
              "doubao-seed-2.0-mini",
              "deepseek-v4-flash",
              "deepseek-v4-pro",
              "glm-5.2",
              "glm-latest",
              "kimi-k3",
              "kimi-k2.7-code",
              "minimax-m3",
              "ark-code-latest",
          )
          ''').lstrip(), encoding='utf-8')

          Path('metadata/__init__.py').write_text(
              '"""Model discovery and sparse upstream-feedback translation."""\n',
              encoding='utf-8',
          )

          # ------------------------------------------------------------------
          # Dashboard bridge: model-card transport setting + additive feedback.
          # ------------------------------------------------------------------
          Path('registry.py').write_text(dedent(r'''
          """Plugin-owned Provider registration and narrow AstrBot Dashboard bridge."""

          from __future__ import annotations

          import copy
          from collections.abc import Callable
          from typing import Any

          from astrbot.core.provider.register import (
              provider_cls_map,
              provider_registry,
              register_provider_adapter,
          )

          from .capabilities import (
              AGENT_PLAN_PROVIDER_TYPE,
              ARK_PROVIDER_TYPE,
              OWNED_SOURCE_TYPES,
              VIDEO_INPUT_ENABLED_KEY,
              cleanup_owned_settings_on_source_change,
              get_source_model_hints,
              normalize_owned_model_card_for_save,
              source_types,
              video_input_enabled,
          )

          PLUGIN_MODULE_MARKER = "astrbot_plugin_volcengine_provider"

          _DASHBOARD_LEASE_COUNT = 0
          _SCHEMA_WRAPPER: Callable[..., Any] | None = None
          _SCHEMA_ORIGINAL: Callable[..., Any] | None = None
          _MODELS_WRAPPER: Callable[..., Any] | None = None
          _MODELS_ORIGINAL: Callable[..., Any] | None = None
          _CREATE_WRAPPER: Callable[..., Any] | None = None
          _CREATE_ORIGINAL: Callable[..., Any] | None = None
          _UPDATE_WRAPPER: Callable[..., Any] | None = None
          _UPDATE_ORIGINAL: Callable[..., Any] | None = None


          def _inject_model_card_video_control(payload: dict[str, Any]) -> dict[str, Any]:
              """Expose a transport toggle only on concrete Volcengine model cards."""

              try:
                  items = payload["config_schema"]["provider"]["items"]
              except (KeyError, TypeError):
                  return payload
              if not isinstance(items, dict):
                  return payload

              items.setdefault(
                  VIDEO_INPUT_ENABLED_KEY,
                  {
                      "description": "视频请求通道（当前模型卡）",
                      "type": "bool",
                      "hint": (
                          "仅控制火山适配器是否按 Ark video_url 协议尝试发送本轮视频；"
                          "不是模型能力结论。关闭时保留 [Video] 文本占位。"
                      ),
                  },
              )

              types = source_types(payload)
              providers = payload.get("providers", [])
              if not isinstance(providers, list):
                  return payload
              for provider in providers:
                  if not isinstance(provider, dict):
                      continue
                  source_id = str(provider.get("provider_source_id") or "").strip()
                  if types.get(source_id) not in OWNED_SOURCE_TYPES:
                      continue
                  provider.setdefault(VIDEO_INPUT_ENABLED_KEY, video_input_enabled(provider))
              return payload


          def _is_owned_source(service: Any, source_id: str) -> bool:
              config = getattr(service, "config", {})
              types = source_types(config if hasattr(config, "get") else {})
              return types.get(source_id) in OWNED_SOURCE_TYPES


          def _merge_source_feedback(base: object, hint: object) -> dict[str, Any]:
              """Add sparse Ark feedback without erasing AstrBot feedback."""

              merged = copy.deepcopy(base) if isinstance(base, dict) else {}
              if not isinstance(hint, dict):
                  return merged

              for key, value in hint.items():
                  if key == "modalities" and isinstance(value, dict):
                      current = merged.setdefault("modalities", {})
                      if not isinstance(current, dict):
                          current = {}
                          merged["modalities"] = current
                      for direction in ("input", "output"):
                          incoming = value.get(direction)
                          if not isinstance(incoming, list):
                              continue
                          existing = current.get(direction)
                          existing_list = list(existing) if isinstance(existing, list) else []
                          current[direction] = list(dict.fromkeys([*existing_list, *incoming]))
                      continue

                  if key == "limit" and isinstance(value, dict):
                      current = merged.setdefault("limit", {})
                      if not isinstance(current, dict):
                          current = {}
                          merged["limit"] = current
                      for name, incoming in value.items():
                          if not current.get(name) and incoming:
                              current[name] = copy.deepcopy(incoming)
                      continue

                  if key not in merged or merged[key] in (None, ""):
                      merged[key] = copy.deepcopy(value)
              return merged


          def _overlay_source_scoped_model_hints(
              service: Any,
              source_id: str,
              result: dict[str, Any],
          ) -> dict[str, Any]:
              if not _is_owned_source(service, source_id):
                  return result
              models = [str(model) for model in result.get("models", []) or []]
              hints = get_source_model_hints(source_id, models)
              if not hints:
                  return result
              metadata = result.setdefault("model_metadata", {})
              if not isinstance(metadata, dict):
                  return result
              for model_id, hint in hints.items():
                  metadata[model_id] = _merge_source_feedback(metadata.get(model_id), hint)
              return result


          def acquire_owned_dashboard_bridge() -> None:
              """Install reversible model-card UI/save and Source-feedback wrappers."""

              global _DASHBOARD_LEASE_COUNT
              global _SCHEMA_WRAPPER, _SCHEMA_ORIGINAL, _MODELS_WRAPPER, _MODELS_ORIGINAL
              global _CREATE_WRAPPER, _CREATE_ORIGINAL, _UPDATE_WRAPPER, _UPDATE_ORIGINAL

              if _DASHBOARD_LEASE_COUNT:
                  _DASHBOARD_LEASE_COUNT += 1
                  return

              from astrbot.dashboard.services.config_service import ProviderConfigService

              schema_current = ProviderConfigService.get_provider_schema
              if getattr(schema_current, "_volcengine_provider_schema_wrapper", False):
                  schema_current = getattr(schema_current, "_volcengine_provider_schema_original")

              models_current = ProviderConfigService.list_provider_source_models
              if getattr(models_current, "_volcengine_source_models_wrapper", False):
                  models_current = getattr(models_current, "_volcengine_source_models_original")

              create_current = ProviderConfigService.create_provider
              if getattr(create_current, "_volcengine_model_save_wrapper", False):
                  create_current = getattr(create_current, "_volcengine_model_save_original")

              update_current = ProviderConfigService.update_provider
              if getattr(update_current, "_volcengine_model_save_wrapper", False):
                  update_current = getattr(update_current, "_volcengine_model_save_original")

              def schema_wrapper(self) -> dict[str, Any]:
                  return _inject_model_card_video_control(schema_current(self))

              async def models_wrapper(self, source_id: str) -> dict[str, Any]:
                  return _overlay_source_scoped_model_hints(
                      self,
                      source_id,
                      await models_current(self, source_id),
                  )

              async def create_wrapper(
                  self,
                  config: dict[str, Any],
                  source_id: str | None = None,
              ) -> None:
                  normalized = dict(config)
                  if source_id:
                      normalized["provider_source_id"] = source_id
                  normalize_owned_model_card_for_save(
                      normalized,
                      self.config.get("provider_sources", []),
                      default_enabled=False,
                  )
                  await create_current(self, normalized, source_id)

              async def update_wrapper(
                  self,
                  provider_id: str,
                  config: dict[str, Any],
              ) -> None:
                  normalized = dict(config)
                  existing = self.provider_manager.get_provider_config_by_id(provider_id)
                  if not isinstance(existing, dict):
                      existing = {}
                  if not normalized.get("provider_source_id") and existing.get("provider_source_id"):
                      normalized["provider_source_id"] = existing["provider_source_id"]

                  sources = self.config.get("provider_sources", [])
                  types = source_types({"provider_sources": sources})
                  old_source_id = str(existing.get("provider_source_id") or "").strip()
                  new_source_id = str(normalized.get("provider_source_id") or "").strip()
                  old_type = types.get(old_source_id, "")
                  new_type = types.get(new_source_id, "")

                  cleanup_owned_settings_on_source_change(
                      normalized,
                      old_source_type=old_type,
                      new_source_type=new_type,
                  )

                  if (
                      new_type in OWNED_SOURCE_TYPES
                      and VIDEO_INPUT_ENABLED_KEY not in normalized
                      and old_type in OWNED_SOURCE_TYPES
                      and isinstance(existing.get(VIDEO_INPUT_ENABLED_KEY), bool)
                  ):
                      normalized[VIDEO_INPUT_ENABLED_KEY] = existing[VIDEO_INPUT_ENABLED_KEY]

                  normalize_owned_model_card_for_save(
                      normalized,
                      sources,
                      default_enabled=False,
                  )
