name: Patch native Source template hint projection

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-source-template-hint.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
          fetch-depth: 0
      - name: Patch actual Source-template data path and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          registry = Path('registry.py')
          text = registry.read_text(encoding='utf-8')
          marker = '    provider_sources = payload.get("provider_sources")\n'
          if text.count(marker) != 1:
              raise SystemExit(f'provider_sources marker count={text.count(marker)}')
          template_logic = (
              '    # New Sources are built from config_schema.provider.config_template.\n'
              '    config_schema = payload.get("config_schema")\n'
              '    provider_schema = config_schema.get("provider") if isinstance(config_schema, dict) else None\n'
              '    templates = provider_schema.get("config_template") if isinstance(provider_schema, dict) else None\n'
              '    if isinstance(templates, dict):\n'
              '        copied_templates = copy.deepcopy(templates)\n'
              '        provider_schema["config_template"] = copied_templates\n'
              '        for template in copied_templates.values():\n'
              '            if not isinstance(template, dict):\n'
              '                continue\n'
              '            source_type = str(template.get("type") or "").strip()\n'
              '            if source_type not in OWNED_SOURCE_TYPES:\n'
              '                continue\n'
              '            if not template.get("hint"):\n'
              '                template["hint"] = _SOURCE_TRANSPORT_UI_HINT\n\n'
          )
          text = text.replace(marker, template_logic + marker, 1)
          old_doc = (
              '    The provider-source list is copied before mutation so this explanatory\n'
              '    Dashboard projection cannot become an in-memory configuration side effect\n'
              '    even on AstrBot builds that return live config objects. Existing host/user\n'
              '    hints are preserved rather than overwritten.\n'
          )
          new_doc = (
              '    AstrBot V4 builds new Sources from ``config_schema.provider.config_template``\n'
              '    and existing Sources from ``provider_sources``. Both collections are copied\n'
              '    before mutation. Existing host/user hints are preserved rather than overwritten.\n'
          )
          if text.count(old_doc) != 1:
              raise SystemExit(f'hint doc marker count={text.count(old_doc)}')
          registry.write_text(text.replace(old_doc, new_doc, 1), encoding='utf-8')

          test = Path('tests/test_model_card_ui_scope.py')
          text = test.read_text(encoding='utf-8')
          old = '        "config_schema": {"provider": {"items": {}}},\n'
          new = (
              '        "config_schema": {\n'
              '            "provider": {\n'
              '                "items": {},\n'
              '                "config_template": {\n'
              '                    "ark-template": {"id": "volcengine-ark", "type": ARK_PROVIDER_TYPE},\n'
              '                    "plan-template": {"id": "volcengine-agent-plan", "type": AGENT_PLAN_PROVIDER_TYPE},\n'
              '                    "foreign-template": {"id": "openai", "type": "openai_chat_completion"},\n'
              '                },\n'
              '            },\n'
              '        },\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'template fixture marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '    assert all("hint" not in source for source in sources)\n\n'
          addition = (
              '    projected_templates = out["config_schema"]["provider"]["config_template"]\n'
              '    assert projected_templates["ark-template"]["hint"] == _SOURCE_TRANSPORT_UI_HINT\n'
              '    assert projected_templates["plan-template"]["hint"] == _SOURCE_TRANSPORT_UI_HINT\n'
              '    assert "hint" not in projected_templates["foreign-template"]\n\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'template assertion anchor count={text.count(anchor)}')
          test.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY
      - run: git diff --check
      - name: Run focused regressions on supported AstrBot baselines
        run: |
          python -m pip install uv
          for VERSION in v4.26.1 v4.27.2; do
            rm -rf AstrBot
            git clone --depth 1 --branch "$VERSION" https://github.com/AstrBotDevs/AstrBot.git AstrBot
            uv sync --directory AstrBot
            mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
            rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
            uv run --directory AstrBot python ../tests/test_model_card_ui_scope.py
            uv run --directory AstrBot python ../tests/test_dashboard_save_boundary.py
            uv run --directory AstrBot python ../tests/test_dashboard_bridge_compat.py
          done
      - name: Commit production and persistent regression only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry.py tests/test_model_card_ui_scope.py
          git commit -m "fix: project video transport guidance through Source templates"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
