name: Finalize explicit-zero feedback wording

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/finalize-zero-feedback-doc.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
      - name: Update changelog wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text('utf-8')
          old = '缺失字段保持“未反馈”，显式 `False` 与显式空列表也作为本轮信息保留；'
          new = '缺失字段保持“未反馈”，显式 `False`、显式空列表与显式整数 `0` 都作为本轮信息保留；'
          assert old in text
          p.write_text(text.replace(old, new, 1), 'utf-8')
          PY
          rm .github/workflows/finalize-zero-feedback-doc.yml
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/finalize-zero-feedback-doc.yml
          git diff --cached --check
          git commit -m "docs: include explicit zero in live feedback examples"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
