name: Patch Dashboard canonical projection

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-dashboard-canonical-projection.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
          fetch-depth: 0

      - name: Apply narrow Dashboard projection fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('registry.py')
          text = registry.read_text(encoding='utf-8')
          old = (
              "        provider.setdefault(VIDEO_INPUT_ENABLED_KEY, video_input_enabled(provider))\n"
              "        provider[_video_ui_key(source_id)] = provider[VIDEO_INPUT_ENABLED_KEY]\n"
          )
          new = (
              "        current_value = video_input_enabled(provider)\n"
              "        provider.pop(VIDEO_INPUT_ENABLED_KEY, None)\n"
              "        provider[_video_ui_key(source_id)] = current_value\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'unexpected registry projection snippet count={text.count(old)}')
          text = text.replace(old, new)
          old_comment = (
              "        # The canonical value remains ordinary data but has no shared schema\n"
              "        # item, so it is not rendered on foreign cards.\n"
          )
          new_comment = (
              "        # Dashboard is a projection, not persistence. AstrBotConfig fallback-renders\n"
              "        # unknown iterable keys, so the canonical key must not be returned here.\n"
              "        # Carry only its value through the short-lived Source-scoped UI switch;\n"
              "        # save wrappers translate that switch back to the canonical persistence key.\n"
          )
          if text.count(old_comment) != 1:
              raise SystemExit(f'unexpected registry projection comment count={text.count(old_comment)}')
          registry.write_text(text.replace(old_comment, new_comment), encoding='utf-8')

          test = Path('tests/test_model_card_ui_scope.py')
          text = test.read_text(encoding='utf-8')
          old = (
              '            {"id": "ark-A/m", "provider_source_id": "ark-A", "model": "m"},\n'
              '            {"id": "plan-A/m", "provider_source_id": "plan-A", "model": "m"},\n'
          )
          new = (
              '            {\n'
              '                "id": "ark-A/m",\n'
              '                "provider_source_id": "ark-A",\n'
              '                "model": "m",\n'
              '                VIDEO_INPUT_ENABLED_KEY: True,\n'
              '            },\n'
              '            {\n'
              '                "id": "plan-A/m",\n'
              '                "provider_source_id": "plan-A",\n'
              '                "model": "m",\n'
              '                VIDEO_INPUT_ENABLED_KEY: False,\n'
              '            },\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'unexpected UI test provider fixture count={text.count(old)}')
          text = text.replace(old, new)

          old = (
              '    assert ark_card[ark_ui] is False\n'
              '    assert plan_card[plan_ui] is False\n'
              '    assert VIDEO_INPUT_ENABLED_KEY in ark_card\n'
              '    assert VIDEO_INPUT_ENABLED_KEY in plan_card\n'
              '    assert VIDEO_INPUT_ENABLED_KEY not in foreign_card\n'
          )
          new = (
              '    # Dashboard returns only the Source-scoped UI projection. The canonical\n'
              '    # persistence key must not be present or AstrBot fallback-renders it as\n'
              '    # a second raw field beside the intended switch.\n'
              '    assert ark_card[ark_ui] is True\n'
              '    assert plan_card[plan_ui] is False\n'
              '    assert VIDEO_INPUT_ENABLED_KEY not in ark_card\n'
              '    assert VIDEO_INPUT_ENABLED_KEY not in plan_card\n'
              '    assert VIDEO_INPUT_ENABLED_KEY not in foreign_card\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'unexpected UI test projection assertion count={text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - run: git diff --check

      - name: Install AstrBot 4.27.2 test fixture
        run: |
          git clone --depth 1 --branch v4.27.2 https://github.com/AstrBotDevs/AstrBot.git AstrBot
          python -m pip install uv
          uv sync --directory AstrBot
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/

      - name: Run focused regression suite
        run: |
          uv run --directory AstrBot python ../tests/test_model_card_ui_scope.py
          uv run --directory AstrBot python ../tests/test_dashboard_save_boundary.py
          uv run --directory AstrBot python ../tests/test_dashboard_bridge_compat.py

      - name: Commit production fix only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry.py tests/test_model_card_ui_scope.py
          git commit -m "fix: hide canonical video transport key from Dashboard projection"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
