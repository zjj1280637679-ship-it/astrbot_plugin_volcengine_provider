name: Patch native Source transport hint compatibility v2

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-source-transport-hint-v2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
          fetch-depth: 0

      - name: Reuse v1 patcher with corrected targeting and test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-source-transport-hint.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - run: git diff --check"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patcher = textwrap.dedent(workflow[start:end])

          acquire_old = '''text = replace_once(
              text,
              '    global _CREATE_WRAPPER, _CREATE_ORIGINAL, _UPDATE_WRAPPER, _UPDATE_ORIGINAL\\n',
              '    global _CREATE_WRAPPER, _CREATE_ORIGINAL, _UPDATE_WRAPPER, _UPDATE_ORIGINAL\\n'
              '    global _SOURCE_UPSERT_WRAPPER, _SOURCE_UPSERT_ORIGINAL\\n',
              'acquire source global',
          )'''
          acquire_new = '''old_global = '    global _CREATE_WRAPPER, _CREATE_ORIGINAL, _UPDATE_WRAPPER, _UPDATE_ORIGINAL\\n'
          if text.count(old_global) != 2:
              raise SystemExit(f'acquire/release source global count={text.count(old_global)}')
          text = text.replace(
              old_global,
              old_global + '    global _SOURCE_UPSERT_WRAPPER, _SOURCE_UPSERT_ORIGINAL\\n',
              1,
          )'''
          if patcher.count(acquire_old) != 1:
              raise SystemExit(f'v1 acquire block count={patcher.count(acquire_old)}')
          patcher = patcher.replace(acquire_old, acquire_new)

          release_old = '''# release has the same global line a second time; replace the remaining occurrence.
          old_global = '    global _CREATE_WRAPPER, _CREATE_ORIGINAL, _UPDATE_WRAPPER, _UPDATE_ORIGINAL\\n'
          if text.count(old_global) != 1:
              raise SystemExit(f'release source global remaining count={text.count(old_global)}')
          text = text.replace(
              old_global,
              old_global + '    global _SOURCE_UPSERT_WRAPPER, _SOURCE_UPSERT_ORIGINAL\\n',
          )'''
          release_new = '''# Release is targeted by function boundary; the acquire line still contains
          # the same original text after its extra global declaration is inserted.
          release_marker = '\\ndef release_owned_dashboard_bridge() -> None:\\n'
          if text.count(release_marker) != 1:
              raise SystemExit(f'release function marker count={text.count(release_marker)}')
          before_release, release_tail = text.split(release_marker, 1)
          if release_tail.count(old_global) != 1:
              raise SystemExit(f'release scoped global count={release_tail.count(old_global)}')
          release_tail = release_tail.replace(
              old_global,
              old_global + '    global _SOURCE_UPSERT_WRAPPER, _SOURCE_UPSERT_ORIGINAL\\n',
              1,
          )
          text = before_release + release_marker + release_tail'''
          if patcher.count(release_old) != 1:
              raise SystemExit(f'v1 release block count={patcher.count(release_old)}')
          patcher = patcher.replace(release_old, release_new)

          storage_old = '''text = replace_once(
              text,
              '        self.updated: list[tuple[str, dict]] = []\\n',
              '        self.updated: list[tuple[str, dict]] = []\\n'
              '        self.source_upserts: list[tuple[str, dict]] = []\\n',
              'save test source-upsert storage',
          )'''
          storage_new = '''text = replace_once(
              text,
              '        self.provider_manager = FakeManager(self.config["provider"])\\n',
              '        self.provider_manager = FakeManager(self.config["provider"])\\n'
              '        self.source_upserts: list[tuple[str, dict]] = []\\n',
              'save test source-upsert storage',
          )'''
          if patcher.count(storage_old) != 1:
              raise SystemExit(f'v1 save storage block count={patcher.count(storage_old)}')
          patcher = patcher.replace(storage_old, storage_new)

          exec(compile(patcher, '<source-hint-patcher-v2>', 'exec'), {})
          PY

      - run: git diff --check

      - name: Run focused regressions on supported AstrBot baselines
        run: |
          python -m pip install uv
          for VERSION in v4.26.1 v4.27.2; do
            rm -rf AstrBot
            git clone --depth 1 --branch "$VERSION" https://github.com/AstrBotDevs/AstrBot.git AstrBot
            uv sync --directory AstrBot
            mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
            rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
            uv run --directory AstrBot python ../tests/test_model_card_ui_scope.py
            uv run --directory AstrBot python ../tests/test_dashboard_save_boundary.py
            uv run --directory AstrBot python ../tests/test_dashboard_bridge_compat.py
          done

      - name: Commit production and persistent regressions only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry.py tests/test_model_card_ui_scope.py tests/test_dashboard_save_boundary.py tests/test_dashboard_bridge_compat.py tests/e2e/provider_card_matrix/browser_matrix.py
          git commit -m "fix: expose native discoverable video transport path on model creation"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
