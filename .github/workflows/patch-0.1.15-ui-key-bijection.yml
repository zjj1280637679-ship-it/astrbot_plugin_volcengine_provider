name: Patch 0.1.15 UI key bijection

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-0.1.15-ui-key-bijection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary
      - name: Replace truncated hash with reversible UTF-8 hex
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('registry.py')
          text = p.read_text('utf-8')
          text = text.replace('import copy\nimport hashlib\n', 'import copy\n', 1)
          old = '''def _video_ui_key(source_id: str) -> str:\n    """Return a deterministic non-persistent UI key for one Source ID."""\n\n    digest = hashlib.sha256(source_id.encode("utf-8")).hexdigest()[:16]\n    return f"{_VIDEO_UI_KEY_PREFIX}{digest}"\n'''
          new = '''def _video_ui_key(source_id: str) -> str:\n    """Return a reversible non-persistent UI key for one Source ID.\n\n    UTF-8 hex is injective for Python strings after UTF-8 encoding, unlike a\n    truncated hash.  The longer key exists only in a Dashboard response and is\n    removed before persistence.\n    """\n\n    encoded = source_id.encode("utf-8").hex()\n    return f"{_VIDEO_UI_KEY_PREFIX}{encoded}"\n'''
          assert old in text
          p.write_text(text.replace(old, new, 1), 'utf-8')

          test = Path('tests/test_model_card_ui_scope.py')
          t = test.read_text('utf-8')
          anchor = 'def main() -> None:\n'
          addition = '''def main() -> None:\n    # Dashboard key encoding is reversible/injective rather than probabilistic.\n    for source_id in ("ark-A", "a/b", "a?b", "火山 方舟", "emoji-🚀"):\n        ui_key = _video_ui_key(source_id)\n        encoded = ui_key.removeprefix(_VIDEO_UI_KEY_PREFIX)\n        assert bytes.fromhex(encoded).decode("utf-8") == source_id\n    assert _video_ui_key("a/b") != _video_ui_key("a?b")\n\n'''
          assert anchor in t
          test.write_text(t.replace(anchor, addition, 1), 'utf-8')
          PY
          rm .github/workflows/patch-0.1.15-ui-key-bijection.yml
      - name: Commit patch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.py tests/test_model_card_ui_scope.py .github/workflows/patch-0.1.15-ui-key-bijection.yml
          git diff --cached --check
          git commit -m "fix: make Source-scoped UI keys collision-free"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
