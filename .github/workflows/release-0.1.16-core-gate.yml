name: 0.1.16 Core Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/release-0.1.16-core-gate.yml
      - main.py
      - providers.py
      - registry.py
      - adapters/**
      - capabilities/**
      - metadata/**
      - tests/test_0_1_15_feedback_boundary.py
      - tests/test_dashboard_bridge_compat.py
      - tests/test_dashboard_save_boundary.py
      - tests/test_live_feedback_presence.py
      - tests/test_model_card_ui_scope.py
      - tests/e2e/provider_card_matrix/service_matrix.py
      - tests/e2e/provider_card_matrix/assertions.py

permissions:
  contents: read

jobs:
  core-contracts:
    strategy:
      fail-fast: false
      matrix:
        astrbot_tag: [v4.26.1, v4.27.2]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone tested AstrBot version
        run: git clone --depth 1 --branch "${{ matrix.astrbot_tag }}" https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot
      - name: Install plugin into AstrBot test layout
        run: |
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'AstrBot' \
            ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
      - name: Compile production modules
        run: |
          uv run --directory AstrBot python -m py_compile \
            "$GITHUB_WORKSPACE/main.py" \
            "$GITHUB_WORKSPACE/providers.py" \
            "$GITHUB_WORKSPACE/registry.py" \
            "$GITHUB_WORKSPACE/adapters/audio.py" \
            "$GITHUB_WORKSPACE/adapters/video.py" \
            "$GITHUB_WORKSPACE/adapters/errors.py" \
            "$GITHUB_WORKSPACE/metadata/ark.py" \
            "$GITHUB_WORKSPACE/capabilities/model_scope.py"
      - name: Run capability, migration, Dashboard and feedback contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_0_1_15_feedback_boundary.py \
            tests/test_dashboard_bridge_compat.py \
            tests/test_dashboard_save_boundary.py \
            tests/test_live_feedback_presence.py \
            tests/test_model_card_ui_scope.py
          do
            echo "== $test_file @ ${{ matrix.astrbot_tag }} =="
            uv run --directory AstrBot python "$GITHUB_WORKSPACE/$test_file"
          done
      - name: Run real ProviderConfigService lifecycle matrix
        run: uv run --directory AstrBot python "$GITHUB_WORKSPACE/tests/e2e/provider_card_matrix/service_matrix.py"

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release metadata and explanatory hooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = Path('metadata.yaml').read_text('utf-8')
          assert 'version: "0.1.16"' in metadata
          changelog = Path('CHANGELOG.md').read_text('utf-8')
          assert '## 0.1.16' in changelog
          readme = Path('README.md').read_text('utf-8')
          assert 'version-0.1.16' in readme
          assert '运行证据不是产品接口替身' in readme

          required = [
              'AGENTS.md',
              'docs/AI_RULES.md',
              'docs/KNOWLEDGE_BOUNDARY.md',
              'docs/AI_ONBOARDING.md',
              'docs/PROJECT_STATE.json',
              'docs/TEST_HISTORY.md',
              'docs/REGRESSION_SCOPE.md',
              'docs/ENGINEERING_METHODOLOGY.md',
              'docs/EVIDENCE_LEVELS.md',
              'docs/TEST_BOUNDARIES.md',
              'docs/DECISION_INDEX.json',
              'capabilities/SEMANTICS.json',
          ]
          for filename in required:
              assert Path(filename).is_file(), filename

          state = json.loads(Path('docs/PROJECT_STATE.json').read_text('utf-8'))
          assert state['active_release'] == '0.1.16'
          assert state['current_strategy']['interaction_judgment_rule'] == 'interaction_does_not_grant_judgment_authority'
          assert state['current_strategy']['raw_media_fixture_rule'] == 'protocol_attribution_only_not_product_compatibility_authority'
          print('RELEASE_METADATA_0_1_16=OK')
          PY
