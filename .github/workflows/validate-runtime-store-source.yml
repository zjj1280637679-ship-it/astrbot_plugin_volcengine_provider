name: Validate Runtime Store Source

on:
  workflow_call:
    inputs:
      branch:
        description: Runtime or temporary candidate branch to install
        required: true
        type: string
      expected_ref_sha:
        description: Exact commit the source branch must resolve to
        required: true
        type: string
      manifest_artifact:
        description: Artifact containing runtime-manifest.json for byte identity checks
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native-updater-install:
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.26.1, v4.27.2]
        source_mode: [repo_branch, download_url]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_BRANCH: ${{ inputs.branch }}
      EXPECTED_REF_SHA: ${{ inputs.expected_ref_sha }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.manifest_artifact }}
          path: validation-input
      - name: Prove the requested source ref has not moved
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')
          test -n "$actual"
          test "$actual" = "$EXPECTED_REF_SHA"
      - name: Clone exact AstrBot compatibility target
        run: git clone --depth 1 --branch '${{ matrix.astrbot_ref }}' https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - name: Install exact AstrBot runtime
        run: uv sync --directory AstrBot
      - name: Initialize a clean AstrBot data directory
        shell: bash
        run: |
          set -euo pipefail
          touch AstrBot/.astrbot
          printf '\n' | uv run --directory AstrBot astrbot init
      - name: Install through the version-native AstrBot updater
        shell: bash
        env:
          SOURCE_MODE: ${{ matrix.source_mode }}
        run: |
          set -euo pipefail
          uv run --directory AstrBot python - <<'PY'
          import asyncio
          import os
          import shutil
          from pathlib import Path

          import httpx

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['SOURCE_BRANCH']
          repo_url = f'https://github.com/{repo}/tree/{branch}'
          archive_url = f'https://github.com/{repo}/archive/refs/heads/{branch}.zip'

          try:
              from astrbot.core.star.updater import _PluginUpdater as RuntimeUpdater
          except ModuleNotFoundError:
              from astrbot.core.star.updator import PluginUpdator as RuntimeUpdater

          def retryable(exc):
              if isinstance(exc, httpx.HTTPStatusError):
                  status = exc.response.status_code
                  return status in {408, 429} or status >= 500
              return isinstance(exc, httpx.TransportError)

          def clear_partial_install():
              plugin_root = Path('data/plugins')
              archive = plugin_root / 'astrbot_plugin_volcengine_provider.zip'
              installed = plugin_root / 'astrbot_plugin_volcengine_provider'
              archive.unlink(missing_ok=True)
              if installed.exists():
                  shutil.rmtree(installed)

          async def main():
              mode = os.environ['SOURCE_MODE']
              if mode not in {'repo_branch', 'download_url'}:
                  raise RuntimeError(mode)

              for attempt in range(1, 4):
                  updater = RuntimeUpdater()
                  try:
                      if mode == 'repo_branch':
                          path = await updater.install(repo_url)
                      else:
                          path = await updater.install(
                              repo_url,
                              download_url=archive_url,
                          )
                  except Exception as exc:
                      if attempt == 3 or not retryable(exc):
                          raise
                      clear_partial_install()
                      delay = 2 ** attempt
                      print(
                          f'NATIVE_INSTALL_TRANSIENT_RETRY={attempt} '
                          f'delay={delay}s error={type(exc).__name__}'
                      )
                      await asyncio.sleep(delay)
                      continue
                  print(f'NATIVE_INSTALL_PATH={path}')
                  return

              raise AssertionError('unreachable native installer retry state')

          asyncio.run(main())
          PY
      - name: Verify the installed tree matches the gated manifest byte for byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('AstrBot/data/plugins/astrbot_plugin_volcengine_provider')
          manifest = json.loads(
              Path('validation-input/runtime-manifest.json').read_text('utf-8')
          )
          assert manifest['package'] == 'astrbot_plugin_volcengine_provider'
          manifest_version = manifest.get('version')
          assert isinstance(manifest_version, str) and manifest_version.strip()
          manifest_version = manifest_version.strip()
          assert re.fullmatch(
              r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)',
              manifest_version,
          ) is not None

          expected = {item['path']: item for item in manifest['files']}
          actual = {
              path.relative_to(root).as_posix(): path
              for path in root.rglob('*')
              if path.is_file()
              and '__pycache__' not in path.relative_to(root).parts
              and path.suffix not in {'.pyc', '.pyo'}
          }
          if set(actual) != set(expected):
              raise SystemExit({
                  'missing': sorted(set(expected) - set(actual)),
                  'unexpected': sorted(set(actual) - set(expected)),
              })

          for relative, item in expected.items():
              data = actual[relative].read_bytes()
              if len(data) != item['bytes']:
                  raise SystemExit(f'byte count mismatch: {relative}')
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit(f'sha256 mismatch: {relative}')

          metadata = (root / 'metadata.yaml').read_text('utf-8')
          version_match = re.search(
              r'(?m)^version:\s*["\x27]?([^"\x27\r\n#]+)', metadata
          )
          repo_match = re.search(
              r'(?m)^repo:\s*["\x27]?([^"\x27\r\n#]+)', metadata
          )
          assert version_match is not None
          assert repo_match is not None
          version = version_match.group(1).strip()
          repo = repo_match.group(1).strip()
          assert version == manifest_version, version
          assert repo.endswith('/tree/runtime'), repo
          print(
              f'NATIVE_STORE_SOURCE_IDENTITY=OK '
              f'version={version} files={len(actual)}'
          )
          PY
      - name: Recheck source identity after installation
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')
          test "$actual" = "$EXPECTED_REF_SHA"
      - name: Start AstrBot and prove the installed plugin loads
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run --directory AstrBot astrbot run --port 6185 >native-install-load.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 75); do
            if grep -q 'Volcengine providers registered' native-install-load.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat native-install-load.log
              exit 1
            fi
            sleep 1
          done
          cat native-install-load.log
          test "$ready" = '1'
          kill "$pid" 2>/dev/null || true
