name: Seedance Model Controlled Probe

on:
  push:
    paths:
      - '.github/seedance-model-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model:
          - doubao-seedance-1-5-pro-251215
          - doubao-seedance-1-0-pro-fast-251015
    env:
      ARK_API_KEY: ${{ secrets.HUOSHANYINQINGAPI }}
      MODEL_ID: ${{ matrix.model }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          test -n "$ARK_API_KEY" || { echo 'HUOSHANYINQINGAPI unavailable'; exit 2; }

      - name: Run single-variable T2V probe
        shell: bash
        run: |
          mkdir -p probe_output
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          model = os.environ['MODEL_ID']
          prompt = (
              'Cinematic photorealistic close-up sports training. '
              'An adult athletic man shadowboxes in a professional gym, performs one controlled jab-cross combination, then resets his guard. '
              'Natural body mechanics, subtle sweat under overhead lights, stable readable motion, no blood, no injury. '
              '--ratio 16:9 --dur 5'
          )
          base = 'https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks'
          headers = {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + os.environ['ARK_API_KEY'],
          }
          payload = {
              'model': model,
              'content': [{'type': 'text', 'text': prompt}],
          }
          record = {
              'experiment': 'D-002 controlled model probe',
              'model': model,
              'prompt': prompt,
              'payload_except_model': {'content': payload['content']},
              'start_unix': time.time(),
          }

          def save():
              with open('probe_output/probe_result.json', 'w', encoding='utf-8') as f:
                  json.dump(record, f, ensure_ascii=False, indent=2)

          req = urllib.request.Request(base, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode('utf-8')
                  record['create_http_status'] = r.status
                  created = json.loads(body)
          except urllib.error.HTTPError as e:
              record['create_http_status'] = e.code
              record['create_error_body'] = e.read().decode('utf-8', 'replace')
              record['final_state'] = 'create_failed'
              record['end_unix'] = time.time()
              record['wall_seconds'] = record['end_unix'] - record['start_unix']
              save()
              print(json.dumps(record, ensure_ascii=False, indent=2))
              raise SystemExit(0)

          record['create_response'] = created
          task_id = created.get('id')
          if not task_id:
              record['final_state'] = 'no_task_id'
              record['end_unix'] = time.time()
              record['wall_seconds'] = record['end_unix'] - record['start_unix']
              save()
              raise SystemExit(0)
          record['task_id'] = task_id

          status_url = base + '/' + task_id
          poll_headers = {'Authorization': 'Bearer ' + os.environ['ARK_API_KEY']}
          last = None
          for attempt in range(90):
              req = urllib.request.Request(status_url, headers=poll_headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      last = json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  record['poll_http_status'] = e.code
                  record['poll_error_body'] = e.read().decode('utf-8', 'replace')
                  record['final_state'] = 'poll_failed'
                  break
              status = last.get('status', '')
              record['last_status'] = status
              record['poll_count'] = attempt + 1
              print(model, 'poll', attempt + 1, status)
              if status == 'succeeded':
                  record['final_state'] = 'succeeded'
                  record['final_response'] = last
                  video_url = ((last.get('content') or {}).get('video_url'))
                  if video_url:
                      try:
                          req2 = urllib.request.Request(video_url, headers={'User-Agent': 'github-actions'})
                          with urllib.request.urlopen(req2, timeout=180) as r, open('probe_output/output.mp4', 'wb') as out:
                              while True:
                                  chunk = r.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  out.write(chunk)
                          record['downloaded_video_bytes'] = os.path.getsize('probe_output/output.mp4')
                      except Exception as ex:
                          record['video_download_error'] = repr(ex)
                  break
              if status in ('failed', 'cancelled'):
                  record['final_state'] = status
                  record['final_response'] = last
                  break
              time.sleep(10)
          else:
              record['final_state'] = 'timeout'
              record['final_response'] = last

          record['end_unix'] = time.time()
          record['wall_seconds'] = record['end_unix'] - record['start_unix']
          save()
          print(json.dumps(record, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seedance-probe-${{ matrix.model }}
          path: probe_output/
          if-no-files-found: error
          retention-days: 1
