name: Renderer Boundary Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fix/0.1.24-object-scope-ui
    paths:
      - .github/workflows/renderer-boundary-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Clone exact AstrBot 4.27.3 host
        run: git clone --depth 1 --branch v4.27.3 https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: AstrBot/dashboard/pnpm-lock.yaml
      - name: Build exact Dashboard
        working-directory: AstrBot/dashboard
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Extract ConfigItemRenderer helper structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          assets = Path('AstrBot/dashboard/dist/assets')
          found = []
          for path in sorted(assets.glob('*.js')):
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'config-checkbox' not in text or 'dashboard_totp_manager' not in text:
                  continue
              checkbox = text.find('config-checkbox')
              window_start = max(0, checkbox - 30000)
              window_end = min(len(text), checkbox + 3000)
              window = text[window_start:window_end]

              # getLabel source is: const labels=getTranslatedLabels(itemMeta);
              # return labels ? labels[index] : option.  Minification preserves
              # this data dependency even though every identifier changes.
              pattern = re.compile(
                  r'function\s+(?P<label>[A-Za-z_$][\w$]*)'
                  r'\((?P<meta>[A-Za-z_$][\w$]*),(?P<index>[A-Za-z_$][\w$]*),(?P<option>[A-Za-z_$][\w$]*)\)'
                  r'\{const\s+(?P<labels>[A-Za-z_$][\w$]*)=(?P<translated>[A-Za-z_$][\w$]*)\((?P=meta)\);'
                  r'return\s+(?P=labels)\?(?P=labels)\[(?P=index)\]:(?P=option)\}'
              )
              matches = list(pattern.finditer(window))
              for match in matches:
                  translated = match.group('translated')
                  absolute = window_start + match.start()
                  helper_def = re.search(
                      rf'function\s+{re.escape(translated)}\([^)]*\)\{{',
                      text[max(0, absolute - 15000):absolute + 15000],
                  )
                  translated_snippet = ''
                  if helper_def:
                      helper_abs = max(0, absolute - 15000) + helper_def.start()
                      translated_snippet = text[helper_abs:helper_abs + 3500]
                  found.append({
                      'asset': path.name,
                      'label_helper': match.group(0),
                      'label_helper_name': match.group('label'),
                      'translated_helper_name': translated,
                      'translated_helper_snippet': translated_snippet,
                      'render_snippet': text[max(0, checkbox - 2500):checkbox + 1800],
                  })
          print(f'RENDERER_LABEL_HELPER_MATCHES={len(found)}')
          for item in found:
              print('--- ASSET', item['asset'], '---')
              print('LABEL_HELPER=', item['label_helper'])
              print('TRANSLATED_HELPER_NAME=', item['translated_helper_name'])
              print('TRANSLATED_HELPER_SNIPPET=', item['translated_helper_snippet'])
              print('RENDER_SNIPPET=', item['render_snippet'])
          if len(found) != 1:
              raise SystemExit(f'expected one exact ConfigItemRenderer label helper, got {len(found)}')
          PY
