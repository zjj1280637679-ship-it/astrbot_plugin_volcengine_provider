name: Patch 0.1.15 semantics docs

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/patch-0.1.15-doc-semantics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.1.15-feedback-boundary

      - name: Synchronize README and changelog semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text('utf-8')
          old = "普通通道会使用你当前填写的推理 Key 调用同一 `api_base` 下的 `/models`，不会再用离线白名单把结果截成少数几项。若 `/models` 明确返回模态、工具、reasoning、上下文或输出限制，插件只把这些字段作为当前 Source 的补充反馈；缺失字段保持未反馈，并且不会覆盖 AstrBot 已有反馈。"
          new = "普通通道会使用你当前填写的推理 Key 调用同一 `api_base` 下的 `/models`，不会再用离线白名单把结果截成少数几项。若 `/models` 明确返回模态、工具、reasoning、上下文或输出限制，这些字段只作为**当前这一轮 Source 回执**展示：缺失字段保持未反馈；明确返回的字段（包括 `False`）只在本次模型列表响应中替换同名旧展示值，读取后即丢弃，不写回 AstrBot 全局模型元数据。"
          assert old in text
          text = text.replace(old, new, 1)

          old = "- 普通 Ark `/models` 只贡献当前 Source 的稀疏补充反馈，不覆盖 AstrBot 已有反馈；Agent Plan 只提供 model-name 候选，不维护跨模型厂商的能力先验表。"
          new = "- 普通 Ark `/models` 只贡献当前这一轮 Source 的稀疏反馈：请求前清旧值、并发请求隔离、读取一次即消费；当前回执明确字段可在本次响应覆盖同名旧展示值，但绝不写全局模型元数据。Agent Plan 只提供 model-name 候选，不维护跨模型厂商的能力先验表。"
          assert old in text
          text = text.replace(old, new, 1)

          anchor = "你手打一个像路径的字符串、旧历史里只剩下的附件标记，都不会让插件打开本地文件。需要模型在后续独立回合重新观看时，请重新引用或附加原视频。\n"
          addition = anchor + "\n如果音频/视频在 QQ/NapCat/AstrBot 媒体解析或 Ark payload 组装阶段失败，插件会把它标成 `input_transport`：这表示有效请求**尚未到达模型**，模型能力仍未知。若火山 API 已返回模态拒绝或其他上游错误，则继续沿 AstrBot/OpenAI SDK 原生错误链处理。插件只区分失败发生在哪一层，不把一次失败写成永久能力结论，也不自行接管 fallback。\n"
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          readme.write_text(text, 'utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text('utf-8')
          anchor = "## 0.1.15\n\n"
          addition = (
              anchor
              + "- 普通 Ark 动态反馈改为单次实时回执：请求前清理旧值，使用 `ContextVar` 隔离并发模型列表请求，Dashboard 读取一次即消费；当前回执明确字段只覆盖本次 Source 响应中的同名旧展示值，不写入全局 `LLM_METADATAS`，历史回执不能压过新回执。\n"
              + "- 新增 `AdapterInputTransportError` 区分本地媒体传递/归一化/Ark payload 组装失败与上游模型回执；前者明确 `reached_model=false`、`capability_observed=null`，只说明输入链路没送达，不作为模型不支持模态的证据，也不由插件自行决定 fallback。\n"
              + "- 新增 `capabilities/SEMANTICS.json` 机器可读语义契约：允许未来新增能力发现与反馈来源，但必须声明来源、时效和权限，禁止把当前无反馈、历史回执或裸 model ID 升格成永久模型事实。\n"
          )
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          changelog.write_text(text, 'utf-8')
          PY

      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "docs: align 0.1.15 with live feedback semantics"
          git push origin HEAD:refactor/0.1.15-feedback-boundary
