name: Verify provider card service matrix

on:
  push:
    branches:
      - refactor/0.1.15-feedback-boundary
    paths:
      - .github/workflows/verify-provider-card-service-matrix.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref: [v4.26.1, v4.27.2]
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch "${{ matrix.astrbot_ref }}" https://github.com/AstrBotDevs/AstrBot.git AstrBot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory AstrBot
      - name: Install plugin into AstrBot
        run: |
          mkdir -p AstrBot/data/plugins/astrbot_plugin_volcengine_provider
          rsync -a --exclude '.git' --exclude '.github' --exclude 'AstrBot' ./ AstrBot/data/plugins/astrbot_plugin_volcengine_provider/
      - name: Validate matrix files
        run: |
          python -m json.tool docs/PROJECT_STATE.json >/dev/null
          python -m json.tool docs/DECISION_INDEX.json >/dev/null
          python -m json.tool tests/e2e/provider_card_matrix/matrix.json >/dev/null
          python tests/e2e/provider_card_matrix/runner.py
      - name: Run provider-card service lifecycle matrix
        run: uv run --directory AstrBot python ../tests/e2e/provider_card_matrix/service_matrix.py
